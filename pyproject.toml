[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netconsole"
dynamic = ["version"]
description = "NetConsole 网络设备采集与分析工具"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
    "websockets>=16.0,<17",
    "httpx>=0.28.1,<1",
    "netmiko>=4.7.0,<5",
    "paramiko>=4.0.0,<5",
    "cryptography>=49.0.0,<50",
    "openpyxl>=3.1.5",
    "XlsxWriter>=3.2.9",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
]

[tool.setuptools.dynamic]
version = {attr = "netconsole.core.version.APP_VERSION"}

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netconsole = ["assets/*", "docs/*", "resources/*"]
