name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    name: Python core and API
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Core, migration, API, and MESH tests
        run: >-
          python -m pytest
          tests/test_database.py
          tests/test_unified_data_root_migration.py
          tests/test_paths.py
          tests/test_web_architecture.py::test_runtime_mode_and_api_dtos_are_stable
          tests/test_web_architecture.py::test_fastapi_app_exposes_registered_web_modules
          tests/test_web_architecture.py::test_api_runtime_composes_single_shared_services
          tests/test_mesh_analysis_query_service.py
          tests/test_mesh_analysis_web_api.py
          -q

  web:
    name: Web typecheck, tests, and build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run complete Web test suite
        run: pnpm exec vitest run --maxWorkers=2 --testTimeout=20000 --hookTimeout=20000
      - run: pnpm build

  electron:
    name: Electron contract and build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop_electron
    steps:
      - uses: actions/checkout@v4
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            apps/desktop_electron/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Web contract dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install Backend contract dependencies
        run: python -m pip install -c ../../constraints.txt -r ../../requirements-test.txt
      - name: Run Electron contract tests
        run: pnpm test
        env:
          NETCONSOLE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      - run: pnpm run typecheck
      - run: pnpm run build:main
