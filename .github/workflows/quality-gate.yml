name: quality-gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Runner backend for this trusted manual run"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - hosted
          - self-hosted
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  runner-preflight:
    name: Runner preflight
    runs-on: &netconsole_windows_runner >-
      ${{ github.event_name == 'pull_request' && 'windows-latest'
      || github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'hosted' && 'windows-latest'
      || (github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'self-hosted'
      || (github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'auto'
      || github.event_name != 'workflow_dispatch') && vars.NETCONSOLE_CI_RUNNER_MODE == 'self-hosted')
      && 'netconsole-ci-windows-x64'
      || 'windows-latest' }}
    timeout-minutes: 5
    steps:
      - name: Verify runner boundary and toolchain
        shell: pwsh
        env:
          NETCONSOLE_CI_RUNNER_BACKEND: ${{ runner.environment }}
          NETCONSOLE_CI_RUNNER_OS: ${{ runner.os }}
          NETCONSOLE_CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          $backend = $env:NETCONSOLE_CI_RUNNER_BACKEND
          if ($env:GITHUB_EVENT_NAME -eq "pull_request" -and $backend -eq "self-hosted") {
            throw "Public pull_request runs must never use the self-hosted runner."
          }
          if ($backend -eq "self-hosted") {
            $required = @("python", "node", "pnpm", "git")
            foreach ($command in $required) {
              if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
                throw "Self-hosted runner is missing required command: $command"
              }
            }
            $testRoot = [IO.Path]::GetFullPath("D:\NetConsoleTestData")
            if ($testRoot -eq [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)) {
              throw "The test data root must not be the checked-out workspace."
            }
          }
          if ($backend -eq "self-hosted") {
            $pythonVersion = python --version 2>&1
            $nodeVersion = node --version
            $pnpmVersion = pnpm --version
            $gitVersion = git --version
          } else {
            $pythonVersion = "GitHub-hosted image"
            $nodeVersion = "GitHub-hosted image"
            $pnpmVersion = "GitHub-hosted image"
            $gitVersion = "GitHub-hosted image"
          }
          @"
          ## Runner preflight
          - Backend: ``$backend``
          - OS / arch: ``$env:NETCONSOLE_CI_RUNNER_OS`` / ``$env:NETCONSOLE_CI_RUNNER_ARCH``
          - Python: ``$pythonVersion``
          - Node: ``$nodeVersion``
          - pnpm: ``$pnpmVersion``
          - Git: ``$gitVersion``
          - Test data policy: ``D:\NetConsoleTestData\<run-id>`` only
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  change-impact:
    name: Change impact audit
    needs: runner-preflight
    runs-on: *netconsole_windows_runner
    timeout-minutes: 5
    outputs:
      risk_level: ${{ steps.audit.outputs.risk_level }}
      risk_areas: ${{ steps.audit.outputs.risk_areas }}
      owners: ${{ steps.audit.outputs.owners }}
      consumers: ${{ steps.audit.outputs.consumers }}
      compatibility_risks: ${{ steps.audit.outputs.compatibility_risks }}
      consumer_suites: ${{ steps.audit.outputs.consumer_suites }}
      requires_post_merge: ${{ steps.audit.outputs.requires_post_merge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: audit
        name: Classify changed files and consumers
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python -m scripts.quality.check_change_impact
          --base-sha $env:BASE_SHA
          --head-sha $env:HEAD_SHA
          --github-output $env:GITHUB_OUTPUT
          --github-summary $env:GITHUB_STEP_SUMMARY

  python-core:
    name: Python core and API
    needs:
      - runner-preflight
      - change-impact
    runs-on: *netconsole_windows_runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Core, migration, API, and MESH tests
        run: >-
          python -m pytest
          tests/test_database.py
          tests/test_unified_data_root_migration.py
          tests/test_paths.py
          tests/test_web_architecture.py::test_runtime_mode_and_api_dtos_are_stable
          tests/test_web_architecture.py::test_fastapi_app_exposes_registered_web_modules
          tests/test_web_architecture.py::test_api_runtime_composes_single_shared_services
          tests/test_mesh_analysis_query_service.py
          tests/test_mesh_analysis_web_api.py
          -q

  web:
    name: Desktop Renderer typecheck, tests, and build
    needs:
      - runner-preflight
      - change-impact
    runs-on: *netconsole_windows_runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop_renderer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop_renderer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run complete Renderer test suite
        run: pnpm exec vitest run --maxWorkers=1 --testTimeout=20000 --hookTimeout=20000
      - run: pnpm build

  electron:
    name: Electron contract and build
    needs:
      - runner-preflight
      - change-impact
    runs-on: *netconsole_windows_runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop_electron
    steps:
      - uses: actions/checkout@v4
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            apps/desktop_electron/pnpm-lock.yaml
            apps/desktop_renderer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Renderer contract dependencies
        working-directory: apps/desktop_renderer
        run: pnpm install --frozen-lockfile
      - name: Install Backend contract dependencies
        run: python -m pip install -c ../../constraints.txt -r ../../requirements-test.txt
      - name: Run Electron contract tests
        run: pnpm test
        env:
          NETCONSOLE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      - run: pnpm run typecheck
      - run: pnpm run build:main

  regression-gate:
    name: Regression gate complete
    if: ${{ always() }}
    needs:
      - change-impact
      - runner-preflight
      - python-core
      - web
      - electron
    runs-on: *netconsole_windows_runner
    timeout-minutes: 5
    steps:
      - name: Require impact audit and consumer gates
        shell: pwsh
        env:
          CHANGE_IMPACT_RESULT: ${{ needs['change-impact'].result }}
          PYTHON_CORE_RESULT: ${{ needs['python-core'].result }}
          RENDERER_RESULT: ${{ needs.web.result }}
          ELECTRON_RESULT: ${{ needs.electron.result }}
          RISK_LEVEL: ${{ needs['change-impact'].outputs.risk_level }}
          RISK_AREAS: ${{ needs['change-impact'].outputs.risk_areas }}
          OWNERS: ${{ needs['change-impact'].outputs.owners }}
          CONSUMERS: ${{ needs['change-impact'].outputs.consumers }}
          COMPATIBILITY_RISKS: ${{ needs['change-impact'].outputs.compatibility_risks }}
          CONSUMER_SUITES: ${{ needs['change-impact'].outputs.consumer_suites }}
          REQUIRES_POST_MERGE: ${{ needs['change-impact'].outputs.requires_post_merge }}
        run: |
          $results = @(
            $env:CHANGE_IMPACT_RESULT,
            $env:PYTHON_CORE_RESULT,
            $env:RENDERER_RESULT,
            $env:ELECTRON_RESULT
          )
          if ($results.Where({ $_ -ne "success" }).Count -gt 0) {
            throw "Impact audit or a required consumer gate did not succeed: $($results -join ', ')"
          }
          @"
          ## Regression gate

          - Risk level: ``$env:RISK_LEVEL``
          - Risk areas: ``$env:RISK_AREAS``
          - Contract owners: ``$env:OWNERS``
          - Consumers: $env:CONSUMERS
          - Compatibility risks: $env:COMPATIBILITY_RISKS
          - Required suites: ``$env:CONSUMER_SUITES``
          - Post-merge main rerun: ``$env:REQUIRES_POST_MERGE``
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
