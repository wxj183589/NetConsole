name: python-full-regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Runner backend for this trusted manual run"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - hosted
          - self-hosted
  schedule:
    - cron: "17 18 * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-full-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  NETCONSOLE_RUNTIME_MODE: test
  NETCONSOLE_CI_TEST_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}
  NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-preflight

jobs:
  runner-preflight:
    name: Runner preflight
    runs-on: &netconsole_windows_runner >-
      ${{ github.event_name == 'pull_request' && 'windows-latest'
      || github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'hosted' && 'windows-latest'
      || (github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'self-hosted'
      || (github.event_name == 'workflow_dispatch' && inputs.runner_mode == 'auto'
      || github.event_name != 'workflow_dispatch') && vars.NETCONSOLE_CI_RUNNER_MODE == 'self-hosted')
      && 'netconsole-ci-windows-x64'
      || 'windows-latest' }}
    timeout-minutes: 5
    steps:
      - name: Verify runner boundary and toolchain
        shell: pwsh
        env:
          NETCONSOLE_CI_RUNNER_BACKEND: ${{ runner.environment }}
          NETCONSOLE_CI_RUNNER_OS: ${{ runner.os }}
          NETCONSOLE_CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          $backend = $env:NETCONSOLE_CI_RUNNER_BACKEND
          if ($env:NETCONSOLE_CI_RUNNER_OS -ne "Windows") {
            throw "NetConsole CI requires Windows; received $env:NETCONSOLE_CI_RUNNER_OS."
          }
          if ($env:NETCONSOLE_CI_RUNNER_ARCH -ne "X64") {
            throw "NetConsole CI requires X64; received $env:NETCONSOLE_CI_RUNNER_ARCH."
          }
          if ($env:GITHUB_EVENT_NAME -eq "pull_request" -and $backend -eq "self-hosted") {
            throw "Public pull_request runs must never use the self-hosted runner."
          }
          if ($backend -eq "self-hosted") {
            $required = @("python", "node", "pnpm", "git")
            foreach ($command in $required) {
              if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
                throw "Self-hosted runner is missing required command: $command"
              }
            }
            $testRoot = [IO.Path]::GetFullPath("D:\study\NetConsole-Workspace\test-data\NetConsole")
            if ($testRoot -eq [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)) {
              throw "The test data root must not be the checked-out workspace."
            }
            $pythonVersion = python --version 2>&1
            $nodeVersion = node --version
            $pnpmVersion = pnpm --version
            $gitVersion = git --version
          } else {
            $pythonVersion = "GitHub-hosted image"
            $nodeVersion = "GitHub-hosted image"
            $pnpmVersion = "GitHub-hosted image"
            $gitVersion = "GitHub-hosted image"
          }
          $testBase = [IO.Path]::GetFullPath("D:\study\NetConsole-Workspace\test-data\NetConsole").TrimEnd('\') + '\'
          $productionRoot = [IO.Path]::GetFullPath("D:\NetConsoleData").TrimEnd('\')
          $testRoot = [IO.Path]::GetFullPath($env:NETCONSOLE_DATA_ROOT).TrimEnd('\')
          if ($testRoot -eq $productionRoot -or -not $testRoot.StartsWith($testBase, [StringComparison]::OrdinalIgnoreCase)) {
            throw "NETCONSOLE_DATA_ROOT must be a unique child of D:\study\NetConsole-Workspace\test-data\NetConsole and never D:\NetConsoleData."
          }
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          @"
          ## Runner preflight
          - Backend: ``$backend``
          - OS / arch: ``$env:NETCONSOLE_CI_RUNNER_OS`` / ``$env:NETCONSOLE_CI_RUNNER_ARCH``
          - Python: ``$pythonVersion``
          - Node: ``$nodeVersion``
          - pnpm: ``$pnpmVersion``
          - Git: ``$gitVersion``
          - Test data policy: ``D:\study\NetConsole-Workspace\test-data\NetConsole\<run-id>`` only
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Remove preflight test root
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  pytest-full:
    name: Python full regression
    needs: runner-preflight
    runs-on: *netconsole_windows_runner
    timeout-minutes: 30
    env:
      NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-python-full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare isolated test root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:NETCONSOLE_DATA_ROOT | Out-Null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
            requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop_renderer/pnpm-lock.yaml
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install development dependencies
        run: .venv\Scripts\python.exe -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Build Desktop Renderer assets for runtime checks
        shell: pwsh
        working-directory: apps/desktop_renderer
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run complete Python test suite
        run: .venv\Scripts\python.exe -m pytest -q --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - name: Remove isolated test root
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue
