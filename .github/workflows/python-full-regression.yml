name: python-full-regression

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-full-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-full:
    name: Python full regression
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
            requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install development dependencies
        run: .venv\Scripts\python.exe -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Build Web assets for runtime checks
        shell: pwsh
        working-directory: apps/web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run complete Python test suite
        run: .venv\Scripts\python.exe -m pytest -q --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/src
