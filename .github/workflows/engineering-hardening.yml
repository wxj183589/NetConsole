name: engineering-hardening

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  NETCONSOLE_RUNTIME_MODE: test
  NETCONSOLE_STORAGE_MODE: persistent
  PNPM_VERSION: 11.19.0
  NODE_VERSION: "24"

jobs:
  architecture-contract:
    name: Architecture contract
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-architecture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
            requirements-dev.txt
      - name: Install Python development dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            apps/desktop_renderer/pnpm-lock.yaml
            apps/desktop_electron/pnpm-lock.yaml
      - name: Install locked TypeScript dependencies
        run: |
          pnpm --dir apps/desktop_renderer install --frozen-lockfile
          pnpm --dir apps/desktop_electron install --frozen-lockfile
      - name: Run stable Architecture green gates
        run: python -m scripts.quality.run_architecture_green_gates
      - name: Run architecture contract against exact baseline
        run: python -m scripts.quality.baseline_debt_audit --checks architecture
      - name: Remove isolated test root
        if: ${{ always() }}
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  python-regression:
    name: Python regression without baseline debt
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
            requirements-dev.txt
      - name: Install Python development dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            apps/desktop_renderer/pnpm-lock.yaml
            apps/desktop_electron/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: |
          pnpm --dir apps/desktop_renderer install --frozen-lockfile
          pnpm --dir apps/desktop_electron install --frozen-lockfile
          pnpm --dir apps/desktop_renderer build
      - name: Run Device Inventory CLI replay regression
        run: python -m pytest tests/test_device_inventory_replay.py -q --tb=short
      - name: Run Python regression with exact baseline deselection
        run: python -m scripts.quality.baseline_aware_pytest
      - name: Remove isolated test root
        if: ${{ always() }}
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  renderer:
    name: Renderer tests, typecheck, and build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-renderer
    defaults:
      run:
        working-directory: apps/desktop_renderer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop_renderer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run complete Renderer test suite
        run: pnpm exec vitest run
      - name: Run Renderer typecheck
        run: pnpm exec vue-tsc -b
      - name: Build Renderer
        run: pnpm exec vite build
      - name: Remove isolated test root
        if: ${{ always() }}
        working-directory: .
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  electron:
    name: Electron tests, typecheck, and main build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-electron
    defaults:
      run:
        working-directory: apps/desktop_electron
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop_electron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run Electron contract tests
        run: pnpm exec vitest run
      - name: Run Electron typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Build Electron main and preload
        run: node scripts/build.mjs
      - name: Remove isolated test root
        if: ${{ always() }}
        working-directory: .
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  main-contract:
    name: Main contract smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-main-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
            requirements-dev.txt
      - name: Install Python development dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Run main contract smoke
        run: python -m scripts.quality.run_main_contract_smoke --run-id github-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove isolated test root
        if: ${{ always() }}
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  docs-and-diff:
    name: Docs, path, and diff guards
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
      - name: Install locked test dependencies
        run: python -m pip install -c constraints.txt -r requirements-test.txt
      - name: Enforce repository root layout
        run: python -m scripts.quality.check_repository_root_layout
      - name: Run docs and path guards
        run: python -m pytest tests/test_project_docs_layout.py tests/quality/test_directory_readmes.py -q --tb=short
      - name: Check changed diff whitespace
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $baseSha = $env:PR_BASE_SHA
          if ([string]::IsNullOrWhiteSpace($baseSha)) { $baseSha = $env:PUSH_BEFORE_SHA }
          if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -match '^0+$') { $baseSha = git rev-parse HEAD^ }
          git diff --check $baseSha $env:GITHUB_SHA
      - name: Remove isolated test root
        if: ${{ always() }}
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  baseline-debt-audit:
    name: Baseline debt audit and new failure detection
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NETCONSOLE_DATA_ROOT: D:\study\NetConsole-Workspace\test-data\NetConsole\github-actions\${{ github.run_id }}-${{ github.run_attempt }}-baseline-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-runtime.txt
            requirements-test.txt
            requirements-dev.txt
      - name: Install Python development dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            apps/desktop_renderer/pnpm-lock.yaml
            apps/desktop_electron/pnpm-lock.yaml
      - name: Install locked TypeScript dependencies
        run: |
          pnpm --dir apps/desktop_renderer install --frozen-lockfile
          pnpm --dir apps/desktop_electron install --frozen-lockfile
      - name: Compare exact baseline and report shrink
        run: python -m scripts.quality.baseline_debt_audit --checks all
      - name: Remove isolated test root
        if: ${{ always() }}
        run: Remove-Item -LiteralPath $env:NETCONSOLE_DATA_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  blocking-gates:
    name: Engineering hardening blocking gates
    if: ${{ always() }}
    needs:
      - architecture-contract
      - python-regression
      - renderer
      - electron
      - main-contract
      - docs-and-diff
      - baseline-debt-audit
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require every blocking gate to pass
        shell: pwsh
        env:
          ARCHITECTURE_RESULT: ${{ needs['architecture-contract'].result }}
          PYTHON_RESULT: ${{ needs['python-regression'].result }}
          RENDERER_RESULT: ${{ needs.renderer.result }}
          ELECTRON_RESULT: ${{ needs.electron.result }}
          MAIN_RESULT: ${{ needs['main-contract'].result }}
          DOCS_RESULT: ${{ needs['docs-and-diff'].result }}
          BASELINE_RESULT: ${{ needs['baseline-debt-audit'].result }}
        run: |
          $results = @(
            $env:ARCHITECTURE_RESULT,
            $env:PYTHON_RESULT,
            $env:RENDERER_RESULT,
            $env:ELECTRON_RESULT,
            $env:MAIN_RESULT,
            $env:DOCS_RESULT,
            $env:BASELINE_RESULT
          )
          if ($results.Where({ $_ -ne "success" }).Count -gt 0) {
            throw "A blocking engineering hardening gate did not succeed: $($results -join ', ')"
          }
          Write-Output 'BLOCKING_CI=PASS'
